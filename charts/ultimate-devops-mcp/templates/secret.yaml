{{- if and (not .Values.existingSecret) (gt (len .Values.secrets) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "udm.fullname" . }}
  labels:
    {{- include "udm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
